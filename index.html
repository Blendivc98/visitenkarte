<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digitale Visitenkarte · HERZKönig Medizintechnik GmbH</title>
<meta name="description" content="Digitale Visitenkarte der HERZKönig Medizintechnik GmbH. Öffnet sich über ihren QR-Code.">
<!-- Die Karten sind nur über ihren QR-Code gedacht: keine Suchmaschinen, kein Referrer an verlinkte Seiten. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#d41217">
<!-- Name unter dem Symbol auf dem iPhone-Home-Bildschirm; die Seite setzt ihn nach dem Öffnen auf die Person. -->
<meta name="apple-mobile-web-app-title" content="Visitenkarte">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="Digitale Visitenkarte · HERZKönig Medizintechnik GmbH">
<meta property="og:description" content="Öffnet sich über ihren QR-Code.">
<meta property="og:url" content="https://blendivc98.github.io/visitenkarte/">
<meta property="og:image" content="https://blendivc98.github.io/visitenkarte/assets/applogo.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Inter liegt selbst gehostet im Repo (wie auf herzkoenig.com): kein Abruf bei Google Fonts,
     damit beim Öffnen keine IP-Adresse an Dritte geht. */
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("assets/inter-latin.woff2") format("woff2");
  }

  /* Markenfarben aus dem Theme von herzkoenig.com (--bs-primary, --bs-body-color). */
  :root {
    --puls: #d41217;
    --puls-hauch: rgba(212, 18, 23, 0.06);
    --tinte: #2b3136;
    --text-leise: #5b6570; /* 5,9:1 auf Weiß; das Marken-Grau #798490 reicht für kleine Schrift nicht */
    --linie: #dee2e6;
    --papier: #ffffff;
    --weich: cubic-bezier(0.16, 1, 0.3, 1);
    --rand: 24px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--papier);
    color: var(--tinte);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .karte {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /* ---------- Rotes Feld: Marke, Person, Hauptaktion ---------- */

  .kopf {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: var(--puls);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 20px) var(--rand) 32px;
  }

  .leiste {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  /* Auf schmalen Handys wird das Logo kleiner, damit Sprachschalter und QR-Knopf daneben passen. */
  .logo-link { flex: 0 1 auto; min-width: 0; }
  .logo { display: block; width: clamp(140px, calc(100vw - 208px), 200px); height: auto; }

  .leiste-rechts { display: flex; align-items: center; gap: 10px; flex: none; }

  .sprachen {
    display: inline-flex;
    padding: 3px;
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    border-radius: 999px;
  }
  .sprachen button {
    min-width: 40px;
    height: 36px;
    padding: 0 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #fff;
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background-color 0.2s var(--weich), color 0.2s var(--weich);
  }
  .sprachen button[aria-pressed="true"] { background: #fff; color: var(--puls); }
  .sprachen button[aria-pressed="false"]:hover { background: rgba(255, 255, 255, 0.14); }

  .qr-knopf {
    display: inline-grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s var(--weich), border-color 0.2s var(--weich);
  }
  .qr-knopf:hover { background: rgba(255, 255, 255, 0.14); border-color: #fff; }

  .person { margin-top: 40px; }

  .portraet {
    display: grid;
    place-items: center;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3), 0 10px 24px -12px rgba(60, 0, 0, 0.55);
    color: var(--puls);
    font-size: 2.125rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .portraet img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    margin: 22px 0 6px;
    font-size: clamp(2.25rem, 10vw, 2.75rem);
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }

  .titel {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 500;
    line-height: 1.35;
  }

  .speichern {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 56px;
    margin-top: 28px;
    padding: 0 28px;
    border-radius: 999px;
    background: #fff;
    color: var(--tinte);
    font-size: 1.0625rem;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 8px 20px -10px rgba(60, 0, 0, 0.6);
    transition: transform 0.25s var(--weich), box-shadow 0.25s var(--weich), background-color 0.2s;
  }
  .speichern svg { color: var(--puls); flex: none; }
  .speichern:hover { background: #fff7f7; box-shadow: 0 12px 26px -10px rgba(60, 0, 0, 0.65); }
  .speichern:active { transform: translateY(1px) scale(0.99); }

  .kopf :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* Das Herz mit Stecker aus dem Logo, groß angeschnitten. Schlägt beim Öffnen einmal doppelt. */
  .herz {
    position: absolute;
    z-index: -1;
    right: -22%;
    bottom: -14%;
    width: 86%;
    max-width: 440px;
    fill: #fff;
    opacity: 0.1;
    pointer-events: none;
    transform-origin: 50% 55%;
    animation: herzschlag 1.2s var(--weich) 0.35s 1 both;
  }

  @keyframes herzschlag {
    0%   { transform: scale(1); }
    12%  { transform: scale(1.07); }
    26%  { transform: scale(1); }
    38%  { transform: scale(1.045); }
    60%, 100% { transform: scale(1); }
  }

  /* ---------- Weißer Teil: Kontaktwege ---------- */

  .inhalt {
    padding: 8px var(--rand) calc(env(safe-area-inset-bottom) + 32px);
  }

  .kontakte { list-style: none; margin: 0; padding: 0; }

  .kontakte a {
    display: grid;
    grid-template-columns: 24px 1fr 16px;
    align-items: center;
    gap: 16px;
    min-height: 68px;
    padding: 12px 0;
    border-bottom: 1px solid var(--linie);
    color: inherit;
    text-decoration: none;
  }
  .kontakte .symbol { color: var(--puls); }
  .kontakte .pfeil { color: var(--text-leise); transition: transform 0.25s var(--weich); }
  .etikett {
    display: block;
    font-size: 0.8125rem;
    color: var(--text-leise);
  }
  .wert {
    display: block;
    font-size: clamp(0.9375rem, 4.4vw, 1.0625rem);
    font-weight: 500;
    overflow-wrap: break-word;
    transition: color 0.2s;
  }
  .kontakte a:hover .wert { color: var(--puls); }
  .kontakte a:hover .pfeil { transform: translateX(3px); }
  .kontakte a:focus-visible { outline: 2px solid var(--puls); outline-offset: 4px; border-radius: 6px; }

  .firma {
    margin: 28px 0 0;
    max-width: 44ch;
    color: var(--text-leise);
    font-size: 0.9375rem;
  }
  .firma strong { color: var(--tinte); font-weight: 600; }

  .qr-feld { display: none; }

  .fuss {
    display: flex;
    gap: 20px;
    margin-top: 24px;
    font-size: 0.8125rem;
  }
  .fuss a { color: var(--text-leise); text-underline-offset: 3px; }
  .fuss a:hover { color: var(--tinte); }
  .fuss a:focus-visible { outline: 2px solid var(--puls); outline-offset: 3px; border-radius: 4px; }

  /* ---------- QR-Blatt: Handy hinhalten, Gegenüber scannt ---------- */

  .qr-blatt {
    width: 100%;
    max-width: 100%;
    height: 100%;
    max-height: 100%;
    margin: 0;
    padding: calc(env(safe-area-inset-top) + 16px) var(--rand) calc(env(safe-area-inset-bottom) + 24px);
    border: 0;
    background: #fff;
    color: var(--tinte);
  }
  .qr-blatt[open] {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: auftauchen 0.35s var(--weich);
  }
  .qr-blatt::backdrop { background: rgba(43, 49, 54, 0.6); }
  @keyframes auftauchen { from { opacity: 0; transform: translateY(12px); } }

  .schliessen {
    align-self: flex-end;
    display: inline-grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #f1f3f5;
    color: var(--tinte);
    cursor: pointer;
  }
  .schliessen:hover { background: #e6e9ec; }

  .qr-mitte {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
  }
  .qr-bild svg { display: block; width: 100%; height: auto; }
  .qr-mitte .qr-bild { width: min(78vw, 340px); }
  .qr-name { margin: 20px 0 2px; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; }
  .qr-hinweis { margin: 0; color: var(--text-leise); }

  .teilen {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    margin-top: 28px;
    padding: 0 26px;
    border: 0;
    border-radius: 999px;
    background: var(--puls);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .teilen:hover { background: #b80f13; }
  .qr-blatt :focus-visible { outline: 2px solid var(--puls); outline-offset: 3px; }
  .meldung { min-height: 1.5em; margin: 12px 0 0; font-size: 0.9375rem; color: var(--text-leise); }

  /* ---------- Breite Bildschirme: Rot links, Kontaktwege und QR rechts ---------- */

  @media (min-width: 880px) {
    :root { --rand: 64px; }

    .karte {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      grid-template-rows: none;
      min-height: 100vh;
    }

    .kopf {
      position: sticky;
      top: 0;
      height: 100vh;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px var(--rand) 56px;
    }

    .logo { width: 254px; }
    .qr-knopf { display: none; }
    .person { margin-top: 0; }
    .portraet { width: 128px; height: 128px; font-size: 2.75rem; }
    h1 { font-size: clamp(3rem, 5.2vw, 4.75rem); margin-top: 28px; }
    .titel { font-size: 1.375rem; }
    .speichern { display: inline-flex; margin-top: 36px; }
    .herz { width: 78%; max-width: 660px; right: -16%; top: 14%; bottom: auto; }

    .inhalt {
      align-self: center;
      width: 100%;
      max-width: 560px;
      padding: 56px var(--rand);
    }

    .qr-feld {
      display: grid;
      grid-template-columns: 124px 1fr;
      align-items: center;
      gap: 20px;
      margin-top: 36px;
      padding: 20px;
      border: 1px solid var(--linie);
      border-radius: 16px;
    }
    .qr-feld .qr-bild { width: 124px; }
    .qr-feld strong { display: block; font-size: 1.0625rem; }
    .qr-feld p { margin: 4px 0 0; color: var(--text-leise); font-size: 0.9375rem; }
  }

  /* ---------- Zustände: laedt, offen (Schlüssel passt), gesperrt (kein oder falscher Schlüssel) ---------- */
  .karte[data-zustand="laedt"] [data-nur-offen],
  .karte[data-zustand="laedt"] [data-nur-gesperrt],
  .karte[data-zustand="offen"] [data-nur-gesperrt],
  .karte[data-zustand="gesperrt"] [data-nur-offen] { display: none; }

  .hinweis { margin-top: 48px; max-width: 30ch; }
  .hinweis h1 { margin-top: 0; }
  .hinweis p { margin: 12px 0 0; font-size: 1.125rem; font-weight: 500; line-height: 1.4; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!-- RICHTUNG: Die Karte trägt das HERZKönig-Rot als Fläche wie das App-Icon der Firma, nicht als Akzent.
     Oben Marke und Person, darunter weiß die Kontaktwege als Liste; keine Kachel-Raster.
     Signatur: das Herz mit Stecker aus dem Logo, groß angeschnitten, schlägt beim Öffnen einmal doppelt.
     Hauptaktion "Kontakt speichern" liegt im ersten Bildschirm, im Daumenbereich. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-kontakt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></symbol>

    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></symbol>

    <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M21 15h-3a2 2 0 0 0-2 2v4"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></symbol>

</svg>

<main class="karte" data-zustand="laedt">
  <header class="kopf">
    <div class="leiste">
      <a class="logo-link" href="https://www.herzkoenig.com" data-t-aria="zur_website" aria-label="Zur Website"><img class="logo" src="assets/logo-weiss.svg" width="200" height="44" alt="HERZKönig Medizintechnik GmbH"></a>
      <div class="leiste-rechts">
        <div class="sprachen" role="group" data-t-aria="sprache" aria-label="Sprache">
          <button type="button" data-sprache="de" aria-pressed="true" lang="de">DE</button>
          <button type="button" data-sprache="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <button class="qr-knopf" type="button" data-qr-oeffnen data-nur-offen data-t-aria="qr_zeigen" aria-label="QR-Code dieser Karte zeigen">
          <svg width="22" height="22" aria-hidden="true"><use href="#i-qr"/></svg>
        </button>
      </div>
    </div>

    <div class="person" data-nur-offen>
      <div data-portraet></div>
      <h1 data-name></h1>
      <p class="titel" data-titel></p>
      <a class="speichern" href="#" data-speichern>
        <svg width="22" height="22" aria-hidden="true"><use href="#i-kontakt"/></svg>
        <span data-t="speichern">Kontakt speichern</span>
      </a>
    </div>

    <div class="hinweis" data-nur-gesperrt>
      <h1 data-t="visitenkarte">Digitale Visitenkarte</h1>
      <p data-hinweis-text data-t="hinweis_ohne">Diese Karte öffnet sich über ihren QR-Code.</p>
    </div>

    <svg class="herz" viewBox="0 0 100 89" aria-hidden="true" focusable="false"><path d="m89.04,7.99l-.7-.7s-16.4-16.4-32.8,0l-5.5,5.5-4.7-4.7s-17.2-17.2-34.5,0l-3.2,3.2s-17.2,17.2,0,34.5l42.6,42.4,37.7-37.7,5.5-5.5s16.4-16.4,0-32.8l-1-1-8.1,8.1c3.9,4.8,4.9,10.4.3,15l-7.8,7.9-3.7-3.7-6.3,6.3c-.4.4-1,.7-1.6.7s-1.2-.2-1.6-.7c-.9-.9-.9-2.3,0-3.2l6.3-6.3-4.8-4.7-6.3,6.3c-.4.4-1,.7-1.6.7s-1.2-.2-1.6-.7c-.9-.9-.9-2.3,0-3.2l6.3-6.3-3.7-3.7,7.8-7.9c4.6-4.6,10.2-3.6,15,.3l8-8.1Z"/></svg>
  </header>

  <section class="inhalt" data-t-aria="kontaktwege" aria-label="Kontaktwege">
    <ul class="kontakte" data-kontakte data-nur-offen></ul>

    <div class="qr-feld" data-nur-offen>
      <div class="qr-bild" data-qr role="img" data-t-aria="qr_bild" aria-label="QR-Code zu dieser Karte"></div>
      <div>
        <strong data-t="auf_handy">Auf dem Handy öffnen</strong>
        <p data-t="auf_handy_text">Code scannen, dann den Kontakt mit einem Tipp speichern.</p>
      </div>
    </div>

    <p class="firma"><strong>HERZKönig Medizintechnik GmbH</strong></p>

    <nav class="fuss" data-t-aria="rechtliches" aria-label="Rechtliches">
      <a href="https://www.herzkoenig.com/impressum" data-t="impressum">Impressum</a>
      <a href="https://www.herzkoenig.com/datenschutzerklaerung" data-t="datenschutz">Datenschutz</a>
    </nav>
  </section>
</main>

<dialog class="qr-blatt" id="qr-blatt" data-t-aria="qr_blatt" aria-label="QR-Code dieser Karte">
  <button class="schliessen" type="button" data-qr-schliessen data-t-aria="schliessen" aria-label="Schließen">
    <svg width="22" height="22" aria-hidden="true"><use href="#i-zu"/></svg>
  </button>
  <div class="qr-mitte">
    <div class="qr-bild" data-qr role="img" data-t-aria="qr_bild" aria-label="QR-Code zu dieser Karte"></div>
    <p class="qr-name" data-qr-name></p>
    <p class="qr-hinweis" data-t="scannen">Scannen öffnet diese Karte.</p>
    <button class="teilen" type="button" data-teilen>
      <svg width="20" height="20" aria-hidden="true"><use href="#i-teilen"/></svg>
      <span data-teilen-text data-t="teilen">Link teilen</span>
    </button>
    <p class="meldung" data-meldung aria-live="polite"></p>
  </div>
</dialog>

<script>
  (function () {
    "use strict";
    // Muss zu PRAEFIX_DATEI und PRAEFIX_SCHLUESSEL in bauen.py passen.
    var PRAEFIX_DATEI = "hk-visitenkarte/datei/";
    var PRAEFIX_SCHLUESSEL = "hk-visitenkarte/schluessel/";

    // Alle festen Texte der Seite je Sprache. Schlüssel stehen im HTML als data-t (Text)
    // und data-t-aria (Vorlesetext); die Etiketten der Kontaktwege setzt bauen.py mit data-t.
    var TEXTE = {
      de: {
        seitentitel: "Digitale Visitenkarte · HERZKönig Medizintechnik GmbH",
        visitenkarte: "Digitale Visitenkarte",
        hinweis_ohne: "Diese Karte öffnet sich über ihren QR-Code.",
        hinweis_browser: "Dieser Browser kann die Karte nicht öffnen. Bitte mit einem aktuellen Browser erneut scannen.",
        hinweis_netz: "Die Karte ließ sich gerade nicht laden. Bitte später erneut versuchen.",
        hinweis_unbekannt: "Dieser Link ist unvollständig oder die Karte gibt es nicht mehr. Bitte den QR-Code erneut scannen.",
        speichern: "Kontakt speichern",
        mobil: "Mobil", telefon: "Telefon", email: "E-Mail", linkedin: "LinkedIn", website: "Website", adresse: "Adresse",
        auf_handy: "Auf dem Handy öffnen",
        auf_handy_text: "Code scannen, dann den Kontakt mit einem Tipp speichern.",
        impressum: "Impressum", datenschutz: "Datenschutz",
        scannen: "Scannen öffnet diese Karte.",
        teilen: "Link teilen", kopieren: "Link kopieren", kopiert: "Link kopiert.",
        nicht_kopiert: "Kopieren nicht möglich. Link: ", nicht_geteilt: "Teilen hat nicht geklappt. Link: ", link: "Link: ",
        portraet: "Porträt von ",
        zur_website: "Zur Website", sprache: "Sprache", qr_zeigen: "QR-Code dieser Karte zeigen",
        kontaktwege: "Kontaktwege", qr_bild: "QR-Code zu dieser Karte", rechtliches: "Rechtliches",
        qr_blatt: "QR-Code dieser Karte", schliessen: "Schließen"
      },
      en: {
        seitentitel: "Digital business card · HERZKönig Medizintechnik GmbH",
        visitenkarte: "Digital business card",
        hinweis_ohne: "This card opens via its QR code.",
        hinweis_browser: "This browser cannot open the card. Please scan again with an up-to-date browser.",
        hinweis_netz: "The card could not be loaded right now. Please try again later.",
        hinweis_unbekannt: "This link is incomplete or the card no longer exists. Please scan the QR code again.",
        speichern: "Save contact",
        mobil: "Mobile", telefon: "Phone", email: "Email", linkedin: "LinkedIn", website: "Website", adresse: "Address",
        auf_handy: "Open on your phone",
        auf_handy_text: "Scan the code, then save the contact with one tap.",
        impressum: "Legal notice", datenschutz: "Privacy policy",
        scannen: "Scan to open this card.",
        teilen: "Share link", kopieren: "Copy link", kopiert: "Link copied.",
        nicht_kopiert: "Copying failed. Link: ", nicht_geteilt: "Sharing failed. Link: ", link: "Link: ",
        portraet: "Portrait of ",
        zur_website: "Go to website", sprache: "Language", qr_zeigen: "Show this card's QR code",
        kontaktwege: "Contact details", qr_bild: "QR code for this card", rechtliches: "Legal",
        qr_blatt: "QR code of this card", schliessen: "Close"
      }
    };

    var karte = document.querySelector(".karte");
    var hinweis = document.querySelector("[data-hinweis-text]");
    var blatt = document.getElementById("qr-blatt");
    var oeffnen = document.querySelector("[data-qr-oeffnen]");
    var meldung = document.querySelector("[data-meldung]");
    var teilen = document.querySelector("[data-teilen]");
    var teilenText = document.querySelector("[data-teilen-text]");
    var speichern = document.querySelector("[data-speichern]");
    var aktuell = null; // entschlüsselte Karte, sobald geladen

    // Speicher kann fehlen (privates Surfen); dann geht es ohne Merken weiter.
    function lesen(name) {
      try { return localStorage.getItem(name) || ""; } catch (fehler) { return ""; }
    }
    function schreiben(name, wert) {
      try { localStorage.setItem(name, wert); } catch (fehler) { /* ohne Speicher weiter */ }
    }
    function loeschen(name) {
      try { localStorage.removeItem(name); } catch (fehler) { /* ohne Speicher weiter */ }
    }

    // Merkt sich die zuletzt geöffnete Karte, falls ein Home-Bildschirm-Symbol ohne # startet.
    var SPEICHER = "hk-visitenkarte";
    var SPEICHER_SPRACHE = "hk-visitenkarte-sprache";

    // Gewählte Sprache, sonst die des Handys: Deutsch bei deutschem Gerät, sonst Englisch.
    var sprache = lesen(SPEICHER_SPRACHE);
    if (!TEXTE[sprache]) sprache = /^de\b/i.test(navigator.language || "") ? "de" : "en";

    function t(schluessel) {
      return TEXTE[sprache][schluessel];
    }

    function sprachabhaengig() {
      if (!aktuell) {
        document.title = t("seitentitel");
        return;
      }
      document.title = aktuell.seitentitel[sprache];
      document.querySelector("[data-titel]").textContent = aktuell.titel[sprache];
      var bild = document.querySelector(".portraet img");
      if (bild) bild.alt = t("portraet") + aktuell.name;
      // Die Kontaktdatei entsteht erst hier im Browser; auf dem Server liegt sie nur verschlüsselt.
      if (speichern.href.indexOf("blob:") === 0) URL.revokeObjectURL(speichern.href);
      speichern.href = URL.createObjectURL(new Blob([aktuell.vcf[sprache]], { type: "text/vcard;charset=utf-8" }));
      speichern.download = aktuell.vcf_name;
    }

    function anwenden() {
      document.documentElement.lang = sprache;
      document.querySelectorAll("[data-t]").forEach(function (ort) { ort.textContent = t(ort.dataset.t); });
      document.querySelectorAll("[data-t-aria]").forEach(function (ort) { ort.setAttribute("aria-label", t(ort.dataset.tAria)); });
      document.querySelectorAll("[data-sprache]").forEach(function (knopf) {
        knopf.setAttribute("aria-pressed", String(knopf.dataset.sprache === sprache));
      });
      teilenText.textContent = navigator.share ? t("teilen") : t("kopieren");
      meldung.textContent = "";
      sprachabhaengig();
    }

    document.querySelectorAll("[data-sprache]").forEach(function (knopf) {
      knopf.addEventListener("click", function () {
        sprache = knopf.dataset.sprache;
        schreiben(SPEICHER_SPRACHE, sprache);
        anwenden();
      });
    });

    function sperren(schluessel) {
      hinweis.dataset.t = schluessel;
      hinweis.textContent = t(schluessel);
      karte.dataset.zustand = "gesperrt";
    }

    function sha256(text) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    }

    function hex(puffer) {
      return Array.prototype.map.call(new Uint8Array(puffer), function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
    }

    function zeigen(daten) {
      aktuell = daten;
      document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content", daten.name);
      // Die HTML-Teile stammen aus bauen.py (dort escaped) und sind durch AES-GCM gegen Änderung geschützt.
      document.querySelector("[data-portraet]").innerHTML = daten.portraet;
      document.querySelector("[data-name]").textContent = daten.name;
      document.querySelector("[data-kontakte]").innerHTML = daten.kontakte;
      document.querySelector("[data-qr-name]").textContent = daten.name;
      document.querySelectorAll("[data-qr]").forEach(function (ort) { ort.innerHTML = daten.qr; });
      anwenden();
      karte.dataset.zustand = "offen";
    }

    function laden() {
      var geheim = location.hash.slice(1);
      if (!geheim && lesen(SPEICHER)) {
        // Ohne # gestartet (etwa vom Home-Bildschirm): zuletzt geöffnete Karte, Link wieder vollständig.
        geheim = lesen(SPEICHER);
        history.replaceState(null, "", "#" + geheim);
      }
      if (!/^[A-Za-z0-9_-]{16,}$/.test(geheim)) {
        sperren("hinweis_ohne");
        return;
      }
      if (!window.crypto || !crypto.subtle || !window.TextEncoder) {
        sperren("hinweis_browser");
        return;
      }
      karte.dataset.zustand = "laedt";
      sha256(PRAEFIX_DATEI + geheim).then(function (kennung) {
        return fetch("k/" + hex(kennung).slice(0, 20) + ".bin", { cache: "no-cache" });
      }).then(function (antwort) {
        if (antwort.status === 404) throw new Error("unbekannt");
        if (!antwort.ok) throw new Error("netz");
        return Promise.all([antwort.arrayBuffer(), sha256(PRAEFIX_SCHLUESSEL + geheim)]);
      }).then(function (teile) {
        var daten = new Uint8Array(teile[0]);
        return crypto.subtle.importKey("raw", teile[1], "AES-GCM", false, ["decrypt"]).then(function (schluessel) {
          return crypto.subtle.decrypt({ name: "AES-GCM", iv: daten.slice(0, 12) }, schluessel, daten.slice(12));
        });
      }).then(function (klartext) {
        zeigen(JSON.parse(new TextDecoder().decode(klartext)));
        schreiben(SPEICHER, geheim);
      }).catch(function (fehler) {
        if (fehler instanceof TypeError || (fehler && fehler.message === "netz")) {
          sperren("hinweis_netz");
        } else {
          if (lesen(SPEICHER) === geheim) loeschen(SPEICHER);
          sperren("hinweis_unbekannt");
        }
      });
    }

    anwenden();
    window.addEventListener("hashchange", laden);
    laden();

    if (!blatt.showModal) {
      // Sehr alte Browser ohne <dialog>: dann bleibt nur der QR-Code am großen Bildschirm.
      oeffnen.hidden = true;
      return;
    }

    oeffnen.addEventListener("click", function () {
      meldung.textContent = "";
      blatt.showModal();
    });
    document.querySelector("[data-qr-schliessen]").addEventListener("click", function () {
      blatt.close();
    });
    blatt.addEventListener("click", function (ereignis) {
      if (ereignis.target === blatt) blatt.close();
    });

    // Geteilt wird der vollständige Link samt Schlüssel; ohne ihn öffnet sich die Karte nicht.
    teilen.addEventListener("click", function () {
      var url = location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url: url }).catch(function (fehler) {
          if (fehler && fehler.name !== "AbortError") {
            meldung.textContent = t("nicht_geteilt") + url;
          }
        });
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          meldung.textContent = t("kopiert");
        }, function () {
          meldung.textContent = t("nicht_kopiert") + url;
        });
      } else {
        meldung.textContent = t("link") + url;
      }
    });
  })();
</script>
